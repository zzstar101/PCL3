name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PCL3.slnx

      - name: Build
        run: dotnet build PCL3.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/PCL.Minecraft.Tests/PCL.Minecraft.Tests.csproj --configuration Release --no-build
